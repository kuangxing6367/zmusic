name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build
        run: flutter build windows --release --no-pub

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "zmusic-${{ steps.ver.outputs.value }}-windows-x64.zip" `
            -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: zmusic-*-windows-x64.zip
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build apk --release --no-pub

      - name: Package
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "zmusic-${{ steps.ver.outputs.value }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: zmusic-*-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zmusic-*-windows-x64.zip
            zmusic-*-android.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            zmusic ${{ github.ref_name }}

            - Windows：解压 `zmusic-*-windows-x64.zip` 后运行 `zmusic.exe`
            - Android：安装 `zmusic-*-android.apk`（arm64-v8a / armeabi-v7a / x86_64）
